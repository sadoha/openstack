---
# tasks file for horizon
- name: Install required packages
  ansible.builtin.apt:
    name:
      - openstack-dashboard
    state: present
  tags:
    - horizon

- name: Copy Dashboard configuration file to controller node
  ansible.builtin.template:
    src: local_settings.j2
    dest: /etc/openstack-dashboard/local_settings.py
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Restart Apache2
  tags:
    - horizon
