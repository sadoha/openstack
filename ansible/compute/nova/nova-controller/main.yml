---
- name: Install or verify database
  hosts: controller
  become: true
  vars_files:
    - ../../vaults.yml
  roles:
    - mariadb

- name: Configure RabbitMQ server
  hosts: controller
  become: true
  vars_files:
    - ../../vaults.yml
  roles:
    - rabbitmq

- name: Set or verify Keystone config
  hosts: controller
  become: true
  vars_files:
    - ../../vaults.yml
  roles:
    - keystone

- name: Set up the OpenStack Compute nova (controller node)
  hosts: controller
  become: true
  vars_files:
    - ../../vaults.yml
  roles:
    - controller

- name: Define the compute, memory, and storage capacity of computing instances
  hosts: controller
  become: true
  vars_files:
    - ../../vaults.yml
  roles:
    - flavors
