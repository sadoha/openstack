---
- name: Set up the Neutron Server configuration
  hosts: computes
  become: true
  vars_files:
    - ../../../vaults.yml
  roles:
    - neutron

- name: Set up the OpenStack Compute nova (compute node)
  hosts: computes
  become: true
  vars_files:
    - ../../../vaults.yml
  roles:
    - compute

- name: Finalize installation the OpenStack Compute nova
  hosts: controller
  become: true
  vars_files:
    - ../../../vaults.yml
  roles:
    - compute-finalize
