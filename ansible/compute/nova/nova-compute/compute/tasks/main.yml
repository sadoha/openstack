---
# tasks file for nova-compute
- name: Install required packages
  ansible.builtin.apt:
    name:
      - nova-compute
    state: present
  tags:
    - compute
    - nova
    - nova-compute

- name: Copy Nova configuration file to controller node
  ansible.builtin.template:
    #src: nova.conf
    src: nova.j2
    dest: /etc/nova/nova.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Restart Nova Compute
  tags:
    - compute
    - nova
    - nova-compute

- name: Determine whether your compute node supports hardware acceleration for virtual machines
  ansible.builtin.command: egrep -c '(vmx|svm)' /proc/cpuinfo
  register: check_hardware_acceleration
  ignore_errors: yes

- name: Copy Nova Compute configuration file
  ansible.builtin.template:
    src: nova-compute-qemu.j2
    dest: /etc/nova/nova-compute.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  when: check_hardware_acceleration.stdout == "0"
  notify: Restart Nova Compute
  tags:
    - compute
    - nova
    - nova-compute
