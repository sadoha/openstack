---
# tasks file for neutron
- name: Install required packages
  ansible.builtin.apt:
    name:
      - neutron-openvswitch-agent
    state: present
  tags:
    - compute
    - nova
    - nova-compute
    - neutron

- name: Copy Neutron Server configuration file
  ansible.builtin.template:
    src: neutron.j2
    dest: /etc/neutron/neutron.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Restart Neutron Openvswitch Agent
  tags:
    - compute
    - nova
    - nova-compute
    - neutron

- name: Copy Neutron Openvswitch Agent configuration file
  ansible.builtin.template:
    src: openvswitch_agent.j2
    dest: /etc/neutron/plugins/ml2/openvswitch_agent.ini
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Restart Neutron Openvswitch Agent
  tags:
    - compute
    - nova
    - nova-compute
    - neutron
