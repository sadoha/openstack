---
all:
  children:
    controller:
      hosts:
        controller:
          ansible_host: 10.0.2.11
          ansible_host_name: controller
    computes:
      hosts:
        compute-01:
          ansible_host: 10.0.2.31
          ansible_host_name: compute-01
#        compute-02:
#          ansible_host: 10.0.2.32
#          ansible_host_name: compute-02
#    block-storage:
#      hosts:
#        block-storage:
#          ansible_host: 10.0.2.41
#          ansible_host_name: block-storage
    cluster:
      children:
        controller: {}
        computes: {}
#        block-storage: {}
  vars:
    ansible_become: true
    ansible_ssh_common_args:  '-o StrictHostKeyChecking=no'
    mysql_socket_path:        '/var/run/mysqld/mysqld.sock'
    openstack_auth:
      auth:
        auth_url:             "http://controller:5000/v3/"
        project_name:         "{{ admin_project_name }}"
        project_domain_name:  "{{ project_domain_name }}"
        user_domain_name:     "{{ user_domain_name }}"
        username:             "{{ admin_username }}"
        password:             "{{ keystone_bootstrap_password }}"
