---
# tasks file for heat
- name: Create a new database with name 'heat'
  community.mysql.mysql_db:
    name: heat
    login_unix_socket: "{{ mysql_socket_path }}"
    state: present
  register: mysql_db_output

- name: Cretae Heat user and password using socket
  community.mysql.mysql_user:
    name: heat
    host: '%'
    password: "{{ mariadb_heat_password }}"
    priv:
      'heat.*': 'ALL,GRANT'
    login_unix_socket: "{{ mysql_socket_path }}"
    state: present

- name: Install required packages
  ansible.builtin.apt:
    name:
      - heat-api 
      - heat-api-cfn 
      - heat-engine
    state: present
  register: install_heat_output

- name: Configure User and Endpoints
  ansible.builtin.shell: |
    . /root/.bashrc
    openstack user create --domain default --password {{ mariadb_heat_password }} heat
    openstack role add --project {{ project_name }} --user heat admin
    openstack service create --name heat --description "Orchestration" orchestration
    openstack service create --name heat-cfn --description "Orchestration"  cloudformation
  args:
    executable: /bin/sh
  when: install_heat_output.changed|bool == true

- name: Create the Placement API service endpoints
  ansible.builtin.shell: |
    . /root/.bashrc
    openstack endpoint create --region RegionOne orchestration public http://controller:8004/v1/%\(tenant_id\)s
    openstack endpoint create --region RegionOne orchestration internal http://controller:8004/v1/%\(tenant_id\)s
    openstack endpoint create --region RegionOne orchestration admin http://controller:8004/v1/%\(tenant_id\)s
    openstack endpoint create --region RegionOne cloudformation public http://controller:8000/v1
    openstack endpoint create --region RegionOne cloudformation internal http://controller:8000/v1
    openstack endpoint create --region RegionOne cloudformation admin http://controller:8000/v1
  args:
    executable: /bin/sh
  when: install_heat_output.changed|bool == true

- name: Configure Heat User and Domain
  ansible.builtin.shell: |
    . /root/.bashrc
    openstack domain create --description "Stack projects and users" heat
    openstack user create --domain heat --password {{ heat_domain_admin_password }} heat_domain_admin
    openstack role add --domain heat --user-domain heat --user heat_domain_admin admin
    openstack role create heat_stack_owner
    openstack role add --project {{ project_name }} --user demo heat_stack_owner
    openstack role create heat_stack_user
  args:
    executable: /bin/sh
  when: install_heat_output.changed|bool == true

- name: Copy the Heat configuration file to controller node
  ansible.builtin.template:
    src: heat.j2
    dest: /etc/heat/heat.conf 
    owner: root
    group: root
    mode: '0644'
  notify:
    - Restart Heat API
    - Restart Heat API CFG
    - Restart Heat Engine

- name: Populate the database
  ansible.builtin.command: su -s /bin/sh -c "heat-manage db_sync" heat
  when: install_heat_output.changed|bool == true
