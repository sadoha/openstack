---
- name: Install or verify database
  hosts: controller
  become: true
  vars_files:
    - ../../vaults.yml
  roles:
    - mariadb

- name: Configure RabbitMQ server
  hosts: controller
  become: true
  vars_files:
    - ../../vaults.yml
  roles:
    - rabbitmq

- name: Set or verify Keystone config
  hosts: controller
  become: true
  vars_files:
    - ../../vaults.yml
  roles:
    - keystone

- name: Set up the OpenStack Block Storage service
  hosts: controller
  become: true
  vars_files:
    - ../../vaults.yml
  roles:
    - controller

- name: Set up the OpenStack Block Storage Node
  hosts: block-storage
  become: true
  vars_files:
    - ../../vaults.yml
  roles:
    - storage-node
