---
# tasks file for keystone

- name: Install required packages
  ansible.builtin.apt:
    name:
      - keystone
      - python3-openstackclient
    state: present
  register: install_keystone_output
  tags:
    - keystone

- name: Copy Keystone configuration file to controller node
  ansible.builtin.template:
    src: keystone.j2 
    dest: /etc/keystone/keystone.conf 
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Restart Apache2
  register: copy_config_output
  tags:
    - keystone

- name: wait for keystone to come back up
  ansible.builtin.wait_for: 
    host: "{{ ansible_host }}" 
    port: 5000
  tags:
    - keystone

- name: Ensure custom variables are in .bashrc
  ansible.builtin.blockinfile:
    path: /root/.bashrc
    block: |
      # Custom environment variables
      export OS_USERNAME=admin
      export OS_PASSWORD={{ keystone_bootstrap_password }}
      export OS_BOOTSTRAP_PASSWORD={{ keystone_bootstrap_password }}
      export OS_PROJECT_NAME=admin
      export OS_USER_DOMAIN_NAME=Default
      export OS_PROJECT_DOMAIN_NAME=Default
      export OS_AUTH_URL=http://controller:5000/v3
      export OS_IDENTITY_API_VERSION=3
    state: present
    create: yes
  tags:
    - keystone

- name: Ensure database is synced
  ansible.builtin.command: su -s /bin/sh -c "keystone-manage db_sync" keystone
  tags:
    - keystone

- name: Initialize Fernet key repositories fernet_setup
  ansible.builtin.command: keystone-manage fernet_setup --keystone-user keystone --keystone-group keystone
  when: copy_config_output.changed|bool == true
  tags:
    - keystone

- name: Initialize Fernet key repositories credential_setup
  ansible.builtin.command: keystone-manage credential_setup --keystone-user keystone --keystone-group keystone
  when: copy_config_output.changed|bool == true
  tags:
    - keystone

- name: Bootstrap the Identity service
  ansible.builtin.command: keystone-manage bootstrap --bootstrap-password "{{ keystone_bootstrap_password }}" --bootstrap-admin-url http://controller:35357/v3/ --bootstrap-internal-url http://controller:5000/v3/ --bootstrap-public-url http://controller:5000/v3/ --bootstrap-region-id RegionOne
  when: copy_config_output.changed|bool == true
  tags:
    - keystone

- name: Create a project
  openstack.cloud.project:
    cloud: "{{ openstack_auth }}"
    description: "Tha {{ project_name }} project" 
    domain: Default
    is_enabled: True
    name: "{{ project_name }}"
    extra_specs:
      internal_alias: "{{ project_name }}"
    state: present
