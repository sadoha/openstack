---
# tasks file for rabbitmq
- name: Ensure keystone user is present
  rabbitmq_user: 
    user: keystone
    password: "{{ keystone_rabbit_password }}" 
    vhost: /
    configure_priv: .*
    read_priv: .*
    write_priv: .*
    state: present
  tags:
    - shared-services
    - keystone
    - rabbitmq
