---
# tasks file for placement
- name: Install required packages
  ansible.builtin.apt:
    name:
      - placement-api
    state: present
  tags:
    - shared-services
    - placement

- name: Copy placement-api configuration file to controller node
  ansible.builtin.template:
    src: placement.j2
    dest: /etc/placement/placement.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Restart Apache2
  tags:
    - shared-services
    - placement

- name: Populate the Image service database
  ansible.builtin.command: su -s /bin/sh -c "placement-manage db sync" placement
  tags:
    - shared-services
    - placement
