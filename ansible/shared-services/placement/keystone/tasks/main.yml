---
# tasks file for keystone
- name: Create the new OpenStack user
  openstack.cloud.identity_user:
    cloud: "{{ openstack_auth }}"
    name: "placement"
    password: "{{ placement_identity_password }}"
    description: "OpenStack placement user"
    domain: default
    state: present
  tags:
    - placement

- name: Grant an admin role on the user in the project
  openstack.cloud.role_assignment:
    cloud: "{{ openstack_auth }}"
    user: placement
    role: admin
    project: "{{ project_name }}"
    state: present
  tags:
    - placement

- name: Create a new service
  openstack.cloud.catalog_service:
     cloud: "{{ openstack_auth }}"
     name: placement
     type: placement
     description: "OpenStack Placement API Service"
     state: present
  tags:
    - placement

- name: Create endpoints
  openstack.cloud.endpoint:
    cloud: "{{ openstack_auth }}"
    service: "placement"
    endpoint_interface: "{{ item }}"
    url: http://controller:8778
    region: RegionOne
    state: present
  with_items:
    - public
    - internal
    - admin
  tags:
    - placement
