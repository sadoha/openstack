---
# tasks file for images
- name: Download a Ubuntu-24.04-server-cloudimg-amd64 
  ansible.builtin.get_url:
    url: https://cloud-images.ubuntu.com/releases/noble/release-20251026/ubuntu-24.04-server-cloudimg-amd64.img
    dest: /tmp/ubuntu-24.04-server-cloudimg-amd64.img
    mode: '0644'

- name: Upload an image Ubuntu-24.04-server-cloudimg-amd64
  openstack.cloud.image:
    cloud: "{{ openstack_auth }}"
    name: Ubuntu-24.04-server-cloudimg-amd64
    container_format: bare
    disk_format: qcow2
    state: present
    filename: /tmp/ubuntu-24.04-server-cloudimg-amd64.img
    visibility: "public"
    properties:
      cpu_arch: x86_64
      distro: Ubuntu

- name: Download a CentOS-Stream-GenericCloud-10-latest-x86_64
  ansible.builtin.get_url:
    url: https://cloud.centos.org/centos/10-stream/x86_64/images/CentOS-Stream-GenericCloud-10-latest.x86_64.qcow2
    dest: /tmp/CentOS-Stream-GenericCloud-10-latest.x86_64.qcow2
    mode: '0644'

- name: Upload an image CentOS-Stream-GenericCloud-10-latest-x86_64
  openstack.cloud.image:
    cloud: "{{ openstack_auth }}"
    name: CentOS-Stream-GenericCloud-10-latest-x86_64
    container_format: bare
    disk_format: qcow2
    state: present
    filename: /tmp/CentOS-Stream-GenericCloud-10-latest.x86_64.qcow2
    visibility: "public"
    properties:
      cpu_arch: x86_64
      distro: CentOS
