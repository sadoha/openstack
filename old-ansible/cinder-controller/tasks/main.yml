---
# tasks file for cinder-controller
- name: Create a new database with name 'cinder'
  community.mysql.mysql_db:
    name: cinder
    login_unix_socket: "{{ mysql_socket_path }}"
    state: present
  register: mysql_db_output

- name: Cretae Cinder user and password using socket
  community.mysql.mysql_user:
    name: cinder
    host: '%'
    password: "{{ mariadb_cinder_password }}"
    priv:
      'cinder.*': 'ALL,GRANT'
    login_unix_socket: "{{ mysql_socket_path }}"
    state: present

- name: Install required packages
  ansible.builtin.apt:
    name:
      - cinder-api 
      - cinder-scheduler
    state: present
  register: install_cinder_output

- name: Configure User and Endpoints
  ansible.builtin.shell: |
    . /root/.bashrc
    openstack user create --domain default --password {{ mariadb_cinder_password }} cinder
    openstack role add --project {{ project_name }} --user cinder admin
    openstack service create --name cinderv3 --description "OpenStack Block Storage" volumev3
  args:
    executable: /bin/sh
  when: install_cinder_output.changed|bool == true

- name: Create the Placement API service endpoints
  ansible.builtin.shell: |
    . /root/.bashrc
    openstack endpoint create --region RegionOne volumev3 public http://controller:8776/v3/%\(project_id\)s
    openstack endpoint create --region RegionOne volumev3 internal http://controller:8776/v3/%\(project_id\)s
    openstack endpoint create --region RegionOne volumev3 admin http://controller:8776/v3/%\(project_id\)s
  args:
    executable: /bin/sh
  when: install_cinder_output.changed|bool == true

- name: Copy the Cinder configuration file to controller node
  ansible.builtin.template:
    src: cinder.j2
    dest: /etc/cinder/cinder.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Restart Nova API
    - Restart Cinder Scheduler
    - Restart Apache2 Service

- name: Populate the database
  ansible.builtin.command: su -s /bin/sh -c "cinder-manage db sync" cinder
  when: install_cinder_output.changed|bool == true
