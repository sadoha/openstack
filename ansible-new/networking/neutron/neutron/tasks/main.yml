---
# tasks file for neutron
- name: Install required packages
  ansible.builtin.apt:
    name:
      - neutron-server 
      - neutron-plugin-ml2
      - neutron-openvswitch-agent 
      - neutron-dhcp-agent
      - neutron-metadata-agent
      - neutron-l3-agent 
    state: present
  register: install_neutron_output

- name: Copy the neutron configuration file to controller node
  ansible.builtin.template:
    src: neutron.j2
    dest: /etc/neutron/neutron.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Restart All Services

- name: Copy the ml2 configuration file to controller node
  ansible.builtin.template:
    src: ml2_conf.j2
    dest: /etc/neutron/plugins/ml2/ml2_conf.ini
    owner: root
    group: root
    mode: '0644'
  notify:
    - Restart All Services

- name: Copy the metadata agent configuration file to controller node
  ansible.builtin.template:
    src: metadata_agent.j2
    dest: /etc/neutron/metadata_agent.ini
    owner: root
    group: root
    mode: '0644'
  notify:
    - Restart All Services

- name: Copy the openvswitch agent configuration file to controller node
  ansible.builtin.template:
    src: openvswitch_agent.j2
    dest: /etc/neutron/plugins/ml2/openvswitch_agent.ini
    owner: root
    group: root
    mode: '0644'
  notify:
    - Restart All Services

- name: Copy the dhcp agent configuration file to controller node
  ansible.builtin.template:
    src: dhcp_agent.j2
    dest: /etc/neutron/dhcp_agent.ini
    owner: root
    group: root
    mode: '0644'
  notify:
    - Restart All Services

- name: Populate the database
  ansible.builtin.command: su -s /bin/sh -c "neutron-db-manage --config-file /etc/neutron/neutron.conf --config-file /etc/neutron/plugins/ml2/ml2_conf.ini upgrade head" neutron
