---
# tasks file for rabbitmq
- name: Ensure keystone vhost is present
  rabbitmq_vhost: 
    name: /keystone
    state: present
  tags:
    - keystone

- name: Ensure keystone user is present
  rabbitmq_user: 
    user: keystone
    password: "{{ keystone_rabbit_password }}" 
    vhost: /keystone
    configure_priv: .*
    read_priv: .*
    write_priv: .*
    state: present
  tags:
    - keystone
