---
- name: Install or verify Keystone database
  hosts: controller
  become: true
  vars_files:
    - ../../vaults.yml
  roles:
    - mariadb

- name: Configure RabbitMQ server
  hosts: controller
  become: true
  vars_files:
    - ../../vaults.yml
  roles:
    - rabbitmq

- name: Set up the image service glance
  hosts: controller
  become: true
  vars_files:
    - ../../vaults.yml
  roles:
    - app
