---
# tasks file for keystone
- name: Create the new OpenStack user
  openstack.cloud.identity_user:
    cloud: "{{ openstack_auth }}"
    name: "glance"
    password: "{{ glance_identity_password }}"
    description: "OpenStack glance user"
    domain: default
    state: present
  tags:
    - glance

- name: Grant an admin role on the user in the project
  openstack.cloud.role_assignment:
    cloud: "{{ openstack_auth }}"
    user: glance
    role: admin
    project: "{{ project_name }}"
    state: present
  tags:
    - glance

- name: Make sure that the account has reader access to system-scope resources
  openstack.cloud.role_assignment:
    cloud: "{{ openstack_auth }}"
    user: glance
    role: reader
    system: "all"
    state: present
  tags:
    - glance

- name: Create a new service
  openstack.cloud.catalog_service:
     cloud: "{{ openstack_auth }}"
     name: glance
     type: image
     description: "OpenStack Image Service"
     state: present
  tags:
    - glance

- name: Create a public endpoint
  openstack.cloud.endpoint:
     cloud: "{{ openstack_auth }}"
     service: glance
     endpoint_interface: public
     url: http://controller:9292
     region: RegionOne
     state: present
  tags:
    - glance

- name: Create a internal endpoint
  openstack.cloud.endpoint:
     cloud: "{{ openstack_auth }}"
     service: glance
     endpoint_interface: internal
     url: http://controller:9292
     region: RegionOne
     state: present
  tags:
    - glance

- name: Create a admin endpoint
  openstack.cloud.endpoint:
     cloud: "{{ openstack_auth }}"
     service: glance
     endpoint_interface: admin
     url: http://controller:9292
     region: RegionOne
     state: present
  tags:
    - glance
